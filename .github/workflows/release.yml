# 发布：打 `v*` tag 时构建含前端的 wheel 并挂到 GitHub Release。
#
# 存在的理由：前端产物不入库（.gitignore），所以「干净 clone 构建出的 wheel
# 没有界面」。本工作流把产物在 CI 里构建好再打包，用户装 wheel 时不需要 Node。
#
# 用户拿到的一条命令（资产名是标准 wheel 名，含版本号）：
#   pip install https://github.com/open-winmale/wmshare-workbench/releases/latest/download/wmshare_workbench-<ver>-py3-none-any.whl
#
# **为什么资产名必须带版本号**：一度上传过一个去掉版本号的「固定名」副本，
# 想让链接永久有效。但 PEP 427 规定 wheel 文件名必须是
# ``name-version-py3-none-any.whl``；缺版本号时 **pip 直接拒绝**
# （"not a valid wheel filename"）、**uv 也拒绝**（"expected version to start
# with a number"）。那条「最省事」的安装命令一行都跑不起来，且当时 CI 全绿。
# ``/releases/latest/download/`` 本身已指向最新 release，版本号放在文件名里
# 完全不影响链接稳定性。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:      # 允许手动演练，不产生 release 之外的影响

permissions:
  contents: write         # 创建 release 与上传资产

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 装项目本身（含 build 工具），这样 `python -m workbench.build` 可用
      - name: 安装项目
        run: python -m pip install -e ".[dev]"

      # 拓扑顺序：先构建前端产物，再打包。顺序颠倒就会打出没有界面的包。
      - name: 构建前端产物
        run: python -m workbench.build

      - name: 构建 wheel
        run: python -m build --wheel

      # 三道断言：产物在包内、index.html 引用的资源齐全、package 不含源码树
      - name: 断言 wheel 内含前端产物
        run: python gates/check_wheel.py

      # 端到端：在干净环境里装这个 wheel 起服务，确认首页是真实界面而不是提示页。
      # 这一步才是「用户视角」的验证——前面几步都成功也可能装出白屏。
      - name: 干净环境安装并冒烟
        run: |
          set -euo pipefail
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --quiet dist/*.whl
          /tmp/verify/bin/python - <<'PY'
          import json, subprocess, sys, time, urllib.request
          from pathlib import Path

          proc = subprocess.Popen(
              [sys.executable, "-m", "workbench", "--port", "8798"],
              stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          try:
              for _ in range(40):
                  try:
                      with urllib.request.urlopen(
                              "http://127.0.0.1:8798/api/health", timeout=2) as r:
                          if r.status == 200:
                              break
                  except OSError:
                      time.sleep(0.5)
              else:
                  sys.exit("服务未在 20s 内就绪")

              with urllib.request.urlopen("http://127.0.0.1:8798/", timeout=5) as r:
                  html = r.read().decode("utf-8", "replace")
              if "前端尚未构建" in html:
                  sys.exit("FAIL: 首页是「前端未构建」提示页——wheel 里没有界面")
              if 'id="app"' not in html:
                  sys.exit(f"FAIL: 首页不是 Vite 产物：{html[:200]}")
              print("OK   安装后的首页是真实界面")
          finally:
              proc.terminate()
          PY

      # 上传前把版本号取出来，命中文档里的安装链接。
      # 不再复制「去版本号」的副本——那种文件名 pip/uv 都装不了（见文件头）。
      - name: 取版本号
        run: |
          set -euo pipefail
          count=$(ls dist/*.whl | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "FAIL: dist/ 里应只有一个 wheel，实际 $count 个"
            exit 1
          fi
          whl=$(ls dist/*.whl)
          ver=$(python -c "import workbench; print(workbench.__version__)")
          expected="dist/wmshare_workbench-${ver}-py3-none-any.whl"
          # 文件名与 __version__ 必须一致，否则 README 里的链接指向不存在的资产
          if [ "$whl" != "$expected" ]; then
            echo "FAIL: wheel 名 $whl 与 __version__=$ver 不匹配（期望 $expected）"
            exit 1
          fi
          echo "WHL=$whl" >> "$GITHUB_ENV"
          echo "VER=$ver" >> "$GITHUB_ENV"

      - name: 创建 Release 并上传
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.WHL }}
          generate_release_notes: true
          body: |
            ## 安装（无需 Node、无需克隆仓库）

            ```bash
            pip install https://github.com/open-winmale/wmshare-workbench/releases/latest/download/wmshare_workbench-${{ env.VER }}-py3-none-any.whl
            wmshare-workbench
            ```

            打开 http://127.0.0.1:8787/ 即可使用。数据来自 wmshare：
            装了 SDK 即为免注册真实数据；未装则页顶给出接入指引。

            本工具做数据整理与历史归因，**不构成任何投资建议**。
