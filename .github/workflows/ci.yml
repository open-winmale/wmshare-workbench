name: ci

on:
  push:
  pull_request:

jobs:
  gates-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装项目（dev 工具 + wmshare SDK，errors 用例需真跑）
        run: python -m pip install -e ".[dev,data]"

      - name: 构建前端产物
        run: python -m workbench.build

      - name: 八个质量门禁（make check，全离线）
        run: make check

      - name: 离线测试（make test）
        run: make test

  # 「用户装到的包有没有界面」这件事必须由 CI 机械保证。
  # 起因：前端产物被 gitignore，干净 clone 构建出的 wheel 不含 static/，
  # 装上后首页只显示「前端未构建」提示页；而当时的 CI 只跑 make web，
  # 从不构建 wheel，所以永远发现不了。本 job 复刻用户的安装路径。
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: python -m pip install -e ".[dev]"

      # 拓扑顺序：先产物、再打包。颠倒就会打出没有界面的包。
      - name: 构建前端产物
        run: python -m workbench.build

      - name: 构建 wheel
        run: python -m build --wheel

      - name: 断言 wheel 内含前端产物（且不是旧产物）
        run: python gates/check_wheel.py

      # 端到端：干净环境装 wheel → 起服务 → 首页必须是真实界面。
      # 前面的断言都过也可能装出白屏，这一步是「用户视角」的最后一道闸。
      - name: 干净环境安装并冒烟
        run: |
          set -euo pipefail
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --quiet dist/*.whl
          /tmp/verify/bin/python - <<'PY'
          import subprocess, sys, time, urllib.request

          proc = subprocess.Popen(
              [sys.executable, "-m", "workbench", "--port", "8798"],
              stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          try:
              for _ in range(40):
                  try:
                      with urllib.request.urlopen(
                              "http://127.0.0.1:8798/api/health", timeout=2) as r:
                          if r.status == 200:
                              break
                  except OSError:
                      time.sleep(0.5)
              else:
                  sys.exit("服务未在 20s 内就绪")

              with urllib.request.urlopen("http://127.0.0.1:8798/", timeout=5) as r:
                  html = r.read().decode("utf-8", "replace")
              if "前端尚未构建" in html:
                  sys.exit("FAIL: 首页是「前端未构建」提示页——wheel 里没有界面")
              if 'id="app"' not in html:
                  sys.exit(f"FAIL: 首页不是 Vite 产物：{html[:200]}")
              print("OK   安装后的首页是真实界面")
          finally:
              proc.terminate()
          PY
