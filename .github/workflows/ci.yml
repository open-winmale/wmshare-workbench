name: ci

on:
  push:
  pull_request:

jobs:
  gates-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装项目（dev 工具 + wmshare SDK，errors 用例需真跑）
        run: python -m pip install -e ".[dev,data]"

      # 前端产物：make test 的静态托管用例与 check_wheel 都依赖它
      - name: 构建前端产物（make web）
        run: make web

      - name: 八个质量门禁（make check，全离线）
        run: make check

      - name: 离线测试（make test）
        run: make test
